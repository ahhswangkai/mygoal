<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足彩分析</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        select {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }
        
        .nav-tabs {
            display: flex;
            margin-bottom: 20px;
            background: white;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 500;
            color: #718096;
            transition: all 0.3s ease;
        }
        
        .nav-tab.active {
            background: #667eea;
            color: white;
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }
        
        .nav-tab:hover:not(.active) {
            background: #f7fafc;
            color: #4a5568;
        }

        .matches-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-size: 13px;
        }
        .matches-table th, .matches-table td {
            padding: 10px 6px;
            border-bottom: 1px solid #f0f0f0;
            color: #2d3748;
            vertical-align: middle;
        }
        .matches-table thead th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            white-space: nowrap;
            text-align: center;
            padding: 12px 6px;
        }
        .matches-table tbody td {
            text-align: center;
        }
        .matches-table tbody tr:hover {
            background: #f7fafc;
            cursor: pointer;
        }

        /* Column Specifics */
        /* 1. Match Info (场次/联赛/时间 合并) */
        .matches-table th:nth-child(1), .matches-table td:nth-child(1) { 
            width: 95px;
            text-align: left;
            padding-left: 8px;
        }
        .matches-table td:nth-child(1) .match-info {
            line-height: 1.3;
        }
        .matches-table td:nth-child(1) .match-info .match-num {
            font-size: 10px;
            color: #a0aec0;
            margin-bottom: 1px;
        }
        .matches-table td:nth-child(1) .match-info .match-league {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 500;
            margin-bottom: 1px;
        }
        .matches-table td:nth-child(1) .match-info .match-datetime {
            font-size: 10px;
            color: #718096;
        }
        /* 2. Home Team */
        .matches-table th:nth-child(2), .matches-table td:nth-child(2) { 
            text-align: right; 
            font-weight: 600;
            max-width: 100px;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 3. Score */
        .matches-table th:nth-child(3), .matches-table td:nth-child(3) { 
            width: 50px; 
            font-weight: bold; 
            font-size: 12px;
            color: #667eea; 
            white-space: nowrap; 
        }
        /* 4. Away Team */
        .matches-table th:nth-child(4), .matches-table td:nth-child(4) { 
            text-align: left; 
            font-weight: 600;
            max-width: 100px;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 5. Status */
        .matches-table th:nth-child(5), .matches-table td:nth-child(5) { 
            width: 55px;
            min-width: 55px;
            white-space: nowrap;
        }
        .matches-table td:nth-child(5) .status {
            font-size: 11px;
            padding: 3px 8px;
        }
        /* 6, 7, 8 Odds */
        .matches-table th:nth-child(6), .matches-table td:nth-child(6),
        .matches-table th:nth-child(7), .matches-table td:nth-child(7),
        .matches-table th:nth-child(8), .matches-table td:nth-child(8) {
            font-size: 12px;
            min-width: 110px;
            line-height: 1.3;
        }
        .matches-table td:nth-child(6) div,
        .matches-table td:nth-child(7) div,
        .matches-table td:nth-child(8) div {
            margin: 1px 0;
            white-space: nowrap;
        }
        
        /* AI预测列设置最小宽度 */
        .matches-table th:nth-child(10),
        .matches-table td:nth-child(10) {
            min-width: 120px;
            max-width: 160px;
            font-size: 12px;
        }
        
        .match-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .league {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .match-time {
            color: #718096;
            font-size: 13px;
        }
        
        .teams {
            margin: 20px 0;
        }
        
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }
        
        .team-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            flex: 1;
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
            text-align: center;
        }
        
        .vs {
            color: #cbd5e0;
            font-weight: bold;
            margin: 5px 0;
            text-align: center;
        }
        
        .match-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        
        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .status.finished {
            background: #48bb78;
            color: white;
        }
        
        .status.live {
            background: #f56565;
            color: white;
        }
        
        .status.upcoming {
            background: #edf2f7;
            color: #4a5568;
        }
        
        .odds-info {
            color: #718096;
            font-size: 13px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .empty-text {
            color: #718096;
            font-size: 18px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .pagination button {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            color: #4a5568;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }
        
        .odds-hit {
            color: #e53e3e;
            font-weight: bold;
        }
        
        /* AI预测样式 */
        .prediction-cell {
            cursor: pointer;
            transition: background 0.2s;
            vertical-align: top;
        }
        
        .prediction-cell:hover {
            background: #f7fafc;
        }
        
        .pred-success {
            color: #48bb78;
            font-weight: 600;
        }
        
        .pred-warning {
            color: #f6ad55;
            font-weight: 600;
        }
        
        .pred-fail {
            color: #fc8181;
            font-weight: 600;
        }
        
        .pred-pending {
            color: #667eea;
            font-weight: 500;
        }
        
        /* 横向滚动支持 */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .matches-table { min-width: 1100px; }
        
        /* 响应式视图控制 */
        .mobile-view { display: none; }
        .desktop-view { display: block; }
        
        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .controls {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }

            .controls .btn, 
            .controls select, 
            .controls input {
                padding: 6px 10px;
                font-size: 12px;
                height: 32px;
            }
            
            .stats-bar {
                flex-direction: column;
            }
            
            /* 移动端切换为卡片视图 */
            .desktop-view { display: none; }
            .mobile-view { display: flex; flex-direction: column; gap: 15px; }
            
            .mobile-card {
                background: white;
                border-radius: 12px;
                padding: 15px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.05);
                border: 1px solid #e2e8f0;
            }
            
            .m-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
                font-size: 12px;
                color: #718096;
            }
            
            .m-league {
                background: #667eea;
                color: white;
                padding: 2px 8px;
                border-radius: 4px;
                font-weight: 500;
            }
            
            .m-body {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 15px;
            }
            
            .m-team {
                flex: 1;
                font-weight: 600;
                font-size: 15px;
                color: #2d3748;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            
            .m-rank {
                color: #718096;
                font-size: 12px;
                font-weight: normal;
                margin-right: 4px;
            }
            
            .m-team.home { text-align: right; padding-left: 5px; }
            .m-team.away { text-align: left; padding-right: 5px; }
            
            .m-score-box {
                min-width: 80px;
                text-align: center;
                padding: 0 10px;
            }
            
            .m-score {
                font-size: 20px;
                font-weight: bold;
                color: #667eea;
                line-height: 1.2;
            }
            
            .m-status {
                font-size: 11px;
                color: #a0aec0;
            }
            
            .m-footer {
                border-top: 1px solid #f0f0f0;
                padding-top: 10px;
                font-size: 12px;
            }
            
            .m-odds-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
                margin-bottom: 10px;
                background: #f8fafc;
                padding: 8px;
                border-radius: 6px;
            }
            
            .m-odds-item {
                display: flex;
                align-items: flex-start;
                font-size: 13px;
                line-height: 1.4;
            }
            
            .m-odds-label {
                background: #edf2f7;
                color: #4a5568;
                padding: 2px 6px;
                border-radius: 4px;
                margin-right: 8px;
                font-weight: 600;
                min-width: 24px;
                text-align: center;
                height: fit-content;
            }
            
            .m-odds-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                color: #2d3748;
            }

            .m-odds-row-text {
                display: flex;
                gap: 8px;
            }
            
            .m-update-time {
                font-size: 11px;
                color: #718096;
                margin-top: 6px;
                text-align: left;
            }
            
            .m-actions {
                display: flex;
                gap: 8px;
                margin-top: 10px;
                justify-content: flex-end;
            }
            
            /* 移动端分页样式调整 */
            .pagination {
                padding: 10px;
                gap: 8px;
                flex-wrap: wrap;
            }
            
            .pagination button {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .pagination .page-info {
                font-size: 12px;
                width: 100%;
                text-align: center;
                order: -1;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ 足彩分析</h1>
            <div class="controls">
                <select id="leagueFilter">
                    <option value="">所有联赛</option>
                </select>
                <input type="hidden" id="statusFilter" value="">
                <button class="btn btn-primary" onclick="loadMatches()">🔄 刷新数据</button>
                <div style="display:flex;align-items:center;gap:5px;">
                    <input type="date" id="startDate" style="padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px;" onchange="loadMatches(1)">
                    <span style="color:#718096;">至</span>
                    <input type="date" id="endDate" style="padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px;" onchange="loadMatches(1)">
                </div>
                <button class="btn btn-success" onclick="crawlNewData()\">📥 爬取新数据</button>

                <a href="/stats" class="btn btn-success" style="background:linear-gradient(135deg, #fa709a 0%, #fee140 100%);">📊 数据统计</a>
                <a href="/bets" class="btn btn-success" style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);">📝 投注记录</a>
                <a href="/my_picks" class="btn btn-success" style="background:linear-gradient(135deg, #00b09b 0%, #96c93d 100%);">🎯 我的选择</a>
            </div>
        </div>
        
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('', this)">全部</div>
            <div class="nav-tab" onclick="switchTab('0', this)">未开始</div>
            <div class="nav-tab" onclick="switchTab('1', this)">进行中</div>
            <div class="nav-tab" onclick="switchTab('2', this)">已完场</div>
        </div>
        
        <div id="crawlLogs" style="display: none;"></div>
        <div id="matchesContainer">
            <div class="loading">加载中...</div>
        </div>
        <div id="paginationContainer"></div>
    </div>

    <script>
        // 获取或生成设备ID
        function getDeviceId() {
            let deviceId = localStorage.getItem('football_device_id');
            if (!deviceId) {
                // 生成简单的随机ID
                deviceId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('football_device_id', deviceId);
            }
            return deviceId;
        }

        let allMatches = [];
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 50;
        
        // 状态持久化键名
        const STORAGE_KEY_PREFIX = 'football_app_home_';

        function saveState() {
            try {
                const state = {
                    startDate: document.getElementById('startDate').value,
                    endDate: document.getElementById('endDate').value,
                    league: document.getElementById('leagueFilter').value,
                    status: document.getElementById('statusFilter').value,
                    scrollY: window.scrollY,
                    page: currentPage // 保存当前页码
                };
                sessionStorage.setItem(STORAGE_KEY_PREFIX + 'state', JSON.stringify(state));
            } catch (e) {
                console.error('保存状态失败:', e);
            }
        }

        function restoreState() {
            try {
                const saved = sessionStorage.getItem(STORAGE_KEY_PREFIX + 'state');
                if (saved) {
                    const state = JSON.parse(saved);
                    
                    // 恢复日期
                    if (state.startDate) document.getElementById('startDate').value = state.startDate;
                    if (state.endDate) document.getElementById('endDate').value = state.endDate;
                    
                    // 恢复状态标签
                    if (state.status !== undefined) {
                        document.getElementById('statusFilter').value = state.status;
                        const tabs = document.querySelectorAll('.nav-tab');
                        tabs.forEach(tab => tab.classList.remove('active'));
                        
                        // 根据状态找到对应的标签并激活
                        // tabs顺序: 全部(''), 未开始('0'), 进行中('1'), 已完场('2')
                        const statusMap = {'': 0, '0': 1, '1': 2, '2': 3};
                        const index = statusMap[state.status];
                        if (index !== undefined && tabs[index]) {
                            tabs[index].classList.add('active');
                        }
                    }
                    
                    return state;
                }
            } catch (e) {
                console.error('恢复状态失败:', e);
            }
            return null;
        }

        // 页面加载时获取数据
        window.onload = async function() {
            // 设置默认日期（如果没有保存的状态）
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;
            
            // 先设置默认值
            document.getElementById('startDate').value = todayStr;
            document.getElementById('endDate').value = todayStr;
            
            // 尝试恢复状态
            const savedState = restoreState();
            
            // 加载联赛数据（需要等待完成以便设置选中的联赛）
            await loadLeagues();
            
            // 恢复联赛选择
            if (savedState && savedState.league) {
                const leagueSelect = document.getElementById('leagueFilter');
                // 检查该联赛是否在选项中存在，存在才选中
                if ([...leagueSelect.options].some(opt => opt.value === savedState.league)) {
                    leagueSelect.value = savedState.league;
                }
            }
            
            // 确定加载的页码
            let pageToLoad = 1;
            if (savedState && savedState.page) {
                pageToLoad = savedState.page;
            }

            // 加载比赛数据
            await loadMatches(pageToLoad);
            
            // 恢复滚动位置
            if (savedState && savedState.scrollY) {
                window.scrollTo(0, savedState.scrollY);
            }
            
            // 注册保存状态的事件
            // 1. 页面卸载/隐藏前保存
            window.addEventListener('beforeunload', saveState);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    saveState();
                }
            });
            // 2. 筛选条件改变时也可保存（可选，这里主要依靠离开时保存）
        };
        
        function switchTab(status, element) {
            document.getElementById('statusFilter').value = status;
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            loadMatches(1);
        }

        // 加载比赛数据
        async function loadMatches(page = 1) {
            try {
                const league = document.getElementById('leagueFilter').value;
                const status = document.getElementById('statusFilter').value;
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                
                let url = `/api/matches?page=${page}&page_size=${pageSize}`;
                if (league) url += `&league=${encodeURIComponent(league)}`;
                if (status) url += `&status=${encodeURIComponent(status)}`;
                if (startDate) url += `&start_date=${encodeURIComponent(startDate)}`;
                if (endDate) url += `&end_date=${encodeURIComponent(endDate)}`;
                
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    allMatches = result.data;
                    currentPage = result.page;
                    totalPages = result.total_pages;
                    displayMatches(allMatches);
                    renderPagination(result);
                } else {
                    showEmpty('加载失败');
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                showEmpty('加载失败: ' + error.message);
            }
        }
        
        // 显示比赛列表
        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                showEmpty('暂无比赛数据');
                return;
            }
            
            const mobileCardsArr = [];
            const rows = matches.map(match => {
                let score = (match.handicap || '-');
                if (match.status === 6) {
                    score = '改期';
                } else if (match.home_score && match.away_score && match.home_score !== '-' && match.away_score !== '-') {
                    score = `${match.home_score}-${match.away_score}`;
                }
                
                // 计算命中逻辑（仅完场比赛）
                let euroResult = null;  // 'win', 'draw', 'lose'
                let asianResult = null; // 'home', 'away'
                let ouResult = null;    // 'over', 'under'
                let hiResult = null;    // 'win', 'draw', 'lose' (让球结果)
                
                if (match.status === 2 && match.home_score && match.away_score && match.home_score !== '-' && match.away_score !== '-') {
                    try {
                        const home = parseInt(match.home_score);
                        const away = parseInt(match.away_score);
                        if (!isNaN(home) && !isNaN(away)) {
                            // 欧赔结果
                            if (home > away) euroResult = 'win';
                            else if (home < away) euroResult = 'lose';
                            else euroResult = 'draw';
                            
                            // 亚盘结果（需要解析盘口）
                            const handicap = match.asian_current_handicap || match.asian_initial_handicap;
                            if (handicap) {
                                let handicapValue = 0;
                                if (handicap.includes('球')) {
                                    const num = handicap.replace(/[^\d.]/g, '');
                                    handicapValue = parseFloat(num) || 0;
                                }
                                const adjustedHome = home + handicapValue;
                                if (adjustedHome > away) asianResult = 'home';
                                else if (adjustedHome < away) asianResult = 'away';
                            }
                            
                            // 大小球结果
                            const total = parseFloat(match.ou_current_total || match.ou_initial_total);
                            if (!isNaN(total)) {
                                const actualTotal = home + away;
                                if (actualTotal > total) ouResult = 'over';
                                else if (actualTotal < total) ouResult = 'under';
                            }

                            // 让球结果
                            const hiHandicap = parseFloat(match.hi_handicap_value);
                            if (!isNaN(hiHandicap)) {
                                const adjustedHome = home + hiHandicap;
                                if (adjustedHome > away) hiResult = 'win';
                                else if (adjustedHome < away) hiResult = 'lose';
                                else hiResult = 'draw';
                            }
                        }
                    } catch (e) {}
                }
                // 注意：数据库字段已修正
                const euroHasInitial = (match.euro_initial_win || match.euro_initial_draw || match.euro_initial_lose);
                const euroHasCurrent = (match.euro_current_win || match.euro_current_draw || match.euro_current_lose);
                const euroInitWin = euroResult === 'win' ? `<span class="odds-hit">${match.euro_initial_win || ''}</span>` : (match.euro_initial_win || '');
                const euroInitDraw = euroResult === 'draw' ? `<span class="odds-hit">${match.euro_initial_draw || ''}</span>` : (match.euro_initial_draw || '');
                const euroInitLose = euroResult === 'lose' ? `<span class="odds-hit">${match.euro_initial_lose || ''}</span>` : (match.euro_initial_lose || '');
                const euroCurrWin = euroResult === 'win' ? `<span class="odds-hit">${match.euro_current_win || ''}</span>` : (match.euro_current_win || '');
                const euroCurrDraw = euroResult === 'draw' ? `<span class="odds-hit">${match.euro_current_draw || ''}</span>` : (match.euro_current_draw || '');
                const euroCurrLose = euroResult === 'lose' ? `<span class="odds-hit">${match.euro_current_lose || ''}</span>` : (match.euro_current_lose || '');
                const euroInit = `${euroInitWin}/${euroInitDraw}/${euroInitLose}`;
                const euroCurr = `${euroCurrWin}/${euroCurrDraw}/${euroCurrLose}`;
                
                // 通用函数：转换为浮点数
                const toFloat = (v) => {
                    const n = parseFloat(v);
                    return isNaN(n) ? null : n;
                };
                // 通用函数：格式化变动
                const fmtChange = (diff) => diff == null ? '—' : ((diff > 0 ? '↑' : (diff < 0 ? '↓' : '—')) + (diff !== 0 ? Math.abs(diff).toFixed(2) : ''));
                
                // 通用函数：格式化赔率行 (left/middle/right)
                const fmtOddsLine = (l, m, r) => {
                    if (!l && !m && !r) return '';
                    return `${l || ''}/${m || ''}/${r || ''}`;
                };
                
                // 赔率更新时间
                const fmtTimeShort = (t) => {
                    if (!t) return '';
                    const full = formatUpdated(t);
                    return full === '未知' ? '' : full.substring(5); // MM-dd HH:mm
                };
                const euroTime = fmtTimeShort(match.euro_odds_update_time);
                const handicapTime = fmtTimeShort(match.odds_update_time);

                // 计算欧赔变动（主/平/客）
                const euroWinInitF = toFloat(match.euro_initial_win);  // 实际初盘
                const euroWinCurrF = toFloat(match.euro_current_win);  // 实际即时
                const euroDrawInitF = toFloat(match.euro_initial_draw);
                const euroDrawCurrF = toFloat(match.euro_current_draw);
                const euroLoseInitF = toFloat(match.euro_initial_lose);
                const euroLoseCurrF = toFloat(match.euro_current_lose);
                const euroWinDiff = (euroWinCurrF != null && euroWinInitF != null) ? (euroWinCurrF - euroWinInitF) : null;
                const euroDrawDiff = (euroDrawCurrF != null && euroDrawInitF != null) ? (euroDrawCurrF - euroDrawInitF) : null;
                const euroLoseDiff = (euroLoseCurrF != null && euroLoseInitF != null) ? (euroLoseCurrF - euroLoseInitF) : null;
                // 欧赔变动高亮：超过10%标红
                const highlightEuroMove = (move, diff) => (diff != null && Math.abs(diff) >= 0.10 ? `<span class="odds-hit">${move}</span>` : move);
                const euroWinMove = highlightEuroMove(fmtChange(euroWinDiff), euroWinDiff);
                const euroDrawMove = highlightEuroMove(fmtChange(euroDrawDiff), euroDrawDiff);
                const euroLoseMove = highlightEuroMove(fmtChange(euroLoseDiff), euroLoseDiff);
                const euroMoveHtml = (euroHasInitial && euroHasCurrent) ? `<div style="color:#718096;font-size:12px;margin-top:4px;">主${euroWinMove} 平${euroDrawMove} 客${euroLoseMove}</div>` : '';
                const euro = (euroHasInitial || euroHasCurrent)
                    ? (euroHasInitial ? '<div>初: ' + euroInit + '</div>' : '') + (euroHasCurrent ? '<div>即: ' + euroCurr + '</div>' : '') + euroMoveHtml + (euroTime ? `<div style="color:#a0aec0;font-size:10px;margin-top:2px;">${euroTime}</div>` : '')
                    : '';
                const asianHasCurrent = (match.asian_current_home_odds || match.asian_current_handicap || match.asian_current_away_odds);
                const asianHasInitial = (match.asian_initial_home_odds || match.asian_initial_handicap || match.asian_initial_away_odds);
                const asianInitHome = asianResult === 'home' ? `<span class="odds-hit">${match.asian_initial_home_odds || ''}</span>` : (match.asian_initial_home_odds || '');
                const asianInitAway = asianResult === 'away' ? `<span class="odds-hit">${match.asian_initial_away_odds || ''}</span>` : (match.asian_initial_away_odds || '');
                const asianCurrHome = asianResult === 'home' ? `<span class="odds-hit">${match.asian_current_home_odds || ''}</span>` : (match.asian_current_home_odds || '');
                const asianCurrAway = asianResult === 'away' ? `<span class="odds-hit">${match.asian_current_away_odds || ''}</span>` : (match.asian_current_away_odds || '');
                const asianInit = `${asianInitHome}/${match.asian_initial_handicap || ''}/${asianInitAway}`;
                const asianCurr = `${asianCurrHome}/${match.asian_current_handicap || ''}/${asianCurrAway}`;
                // 计算亚盘变动（主水/盘口/客水）
                const parseHandicapNum = (h) => {
                    if (!h) return null;
                    const m = String(h).match(/\d+\.?\d*/);
                    return m ? parseFloat(m[0]) : null;
                };
                const homeInitF = toFloat(match.asian_initial_home_odds);
                const homeCurrF = toFloat(match.asian_current_home_odds);
                const awayInitF = toFloat(match.asian_initial_away_odds);
                const awayCurrF = toFloat(match.asian_current_away_odds);
                const handInitF = parseHandicapNum(match.asian_initial_handicap);
                const handCurrF = parseHandicapNum(match.asian_current_handicap);
                const homeDiff = (homeCurrF != null && homeInitF != null) ? (homeCurrF - homeInitF) : null;
                const awayDiff = (awayCurrF != null && awayInitF != null) ? (awayCurrF - awayInitF) : null;
                const handDiff = (handCurrF != null && handInitF != null) ? (handCurrF - handInitF) : null;
                const highlightMove = (move, diff, isOdds) => (isOdds && diff != null && Math.abs(diff) >= 0.10 ? `<span class="odds-hit">${move}</span>` : move);
                const homeMove = highlightMove(fmtChange(homeDiff), homeDiff, true);
                const awayMove = highlightMove(fmtChange(awayDiff), awayDiff, true);
                const handMove = fmtChange(handDiff);
                const moveHtml = (asianHasInitial && asianHasCurrent) ? `<div style="color:#718096;font-size:12px;margin-top:4px;">主${homeMove} 盘${handMove} 客${awayMove}</div>` : '';

                const labelMap = {

                    '降盘降水': { text: '降盘降水', color: '#38a169', bg: '#c6f6d5' },

                const ouCurrUnder = ouResult === 'under' ? `<span class="odds-hit">${match.ou_current_under_odds || ''}</span>` : (match.ou_current_under_odds || '');
                const ouInit = fmtOddsLine(ouInitUnder, match.ou_initial_total, ouInitOver);

                const ou = (ouHasInitial || ouHasCurrent)

                // 让球指数
                const hiHasInitial = match.hi_initial_home_odds && match.hi_initial_draw_odds && match.hi_initial_away_odds;
                const hiHasCurrent = match.hi_current_home_odds && match.hi_current_draw_odds && match.hi_current_away_odds;
                const hiHandicap = match.hi_handicap_value || '';
                
                const hiInitHome = hiResult === 'win' ? `<span class="odds-hit">${match.hi_initial_home_odds || ''}</span>` : (match.hi_initial_home_odds || '');
                const hiInitDraw = hiResult === 'draw' ? `<span class="odds-hit">${match.hi_initial_draw_odds || ''}</span>` : (match.hi_initial_draw_odds || '');
                const hiInitAway = hiResult === 'lose' ? `<span class="odds-hit">${match.hi_initial_away_odds || ''}</span>` : (match.hi_initial_away_odds || '');
                
                const hiCurrHome = hiResult === 'win' ? `<span class="odds-hit">${match.hi_current_home_odds || ''}</span>` : (match.hi_current_home_odds || '');
                const hiCurrDraw = hiResult === 'draw' ? `<span class="odds-hit">${match.hi_current_draw_odds || ''}</span>` : (match.hi_current_draw_odds || '');
                const hiCurrAway = hiResult === 'lose' ? `<span class="odds-hit">${match.hi_current_away_odds || ''}</span>` : (match.hi_current_away_odds || '');

                const hiInit = hiHasInitial ? fmtOddsLine(hiInitHome, hiInitDraw, hiInitAway) : '';
                const hiCurr = hiHasCurrent ? fmtOddsLine(hiCurrHome, hiCurrDraw, hiCurrAway) : '';
                // 计算让球指数变动（主/平/客）
                const hiHomeInitF = toFloat(match.hi_initial_home_odds);
                const hiHomeCurrF = toFloat(match.hi_current_home_odds);
                const hiDrawInitF = toFloat(match.hi_initial_draw_odds);
                const hiDrawCurrF = toFloat(match.hi_current_draw_odds);
                const hiAwayInitF = toFloat(match.hi_initial_away_odds);
                const hiAwayCurrF = toFloat(match.hi_current_away_odds);
                const hiHomeDiff = (hiHomeCurrF != null && hiHomeInitF != null) ? (hiHomeCurrF - hiHomeInitF) : null;
                const hiDrawDiff = (hiDrawCurrF != null && hiDrawInitF != null) ? (hiDrawCurrF - hiDrawInitF) : null;
                const hiAwayDiff = (hiAwayCurrF != null && hiAwayInitF != null) ? (hiAwayCurrF - hiAwayInitF) : null;
                // 让球指数变动高亮：超过10%标红
                const highlightHiMove = (move, diff) => (diff != null && Math.abs(diff) >= 0.10 ? `<span class="odds-hit">${move}</span>` : move);
                const hiHomeMove = highlightHiMove(fmtChange(hiHomeDiff), hiHomeDiff);
                const hiDrawMove = highlightHiMove(fmtChange(hiDrawDiff), hiDrawDiff);
                const hiAwayMove = highlightHiMove(fmtChange(hiAwayDiff), hiAwayDiff);
                const hiMoveHtml = (hiHasInitial && hiHasCurrent) ? `<div style="color:#718096;font-size:12px;margin-top:4px;">主${hiHomeMove} 平${hiDrawMove} 客${hiAwayMove}</div>` : '';
                const hi = (hiHasInitial || hiHasCurrent)
                    ? (hiHandicap ? `<div style="color:#667eea;font-weight:600;">${hiHandicap}</div>` : '') + 
                      (hiHasInitial ? '<div>初: ' + hiInit + '</div>' : '') + 
                      (hiHasCurrent ? '<div>即: ' + hiCurr + '</div>' : '') + 
                      hiMoveHtml
                    : '';
                // 计算总进球数
                let totalGoals = '—';
                if (match.home_score && match.away_score && match.home_score !== '-' && match.away_score !== '-') {
                    try {
                        const home = parseInt(match.home_score);
                        const away = parseInt(match.away_score);
                        if (!isNaN(home) && !isNaN(away)) {
                            totalGoals = (home + away).toString();
                        }
                    } catch (e) {}
                }
                const statusClass = getStatusClass(match.status);
                const statusText = getStatusText(match.status);
                
                // AI预测数据（异步加载）
                const predictionId = `pred-${match.match_id}`;
                
                // 球队名称前显示排名
                const showHomeRank = match.home_rank && parseInt(match.home_rank) >= 1;
                const showAwayRank = match.away_rank && parseInt(match.away_rank) >= 1;

                const homeDisplay = showHomeRank ? `<span style="color:#718096;font-size:11px;margin-right:4px;">[${match.home_rank}]</span>${match.home_team}` : (match.home_team || '主队');
                const awayDisplay = showAwayRank ? `<span style="color:#718096;font-size:11px;margin-right:4px;">[${match.away_rank}]</span>${match.away_team}` : (match.away_team || '客队');
                
                // 生成移动端卡片
                const mHomeTeam = match.home_team || '主队';
                const mAwayTeam = match.away_team || '客队';
                // 强制显示排名以便调试（如果有值的话），并且使用独立的span
                const mHomeRank = showHomeRank ? `<span class="m-rank">[${match.home_rank}]</span>` : '';
                const mAwayRank = showAwayRank ? `<span class="m-rank">[${match.away_rank}]</span>` : '';

                mobileCardsArr.push(`
                    <div class="mobile-card" onclick="viewMatchDetail('${match.match_id}')">

                                <span class="m-league">${match.league || '未知'}</span>
                                <span style="margin-left:5px;">${match.match_number || ''}</span>

                                        ${euroTime ? `<div style="font-size:10px;color:#a0aec0;margin-top:2px;">${euroTime}</div>` : ''}

                                ${ (asianHasInitial || asianHasCurrent) ? `

                                        <div class="m-odds-row-text"><span>即: ${asianCurr}</span></div>

                                <!-- 让球 -->
                                ${ (hiHasInitial || hiHasCurrent) ? `
                                <div class="m-odds-item">
                                    <div class="m-odds-label">让 ${hiHandicap || ''}</div>
                                    <div class="m-odds-content">
                                        ${hiHasInitial ? `<div class="m-odds-row-text"><span>初: ${hiInit}</span></div>` : ''}
                                        ${hiHasCurrent ? `<div class="m-odds-row-text"><span>即: ${hiCurr}</span></div>` : ''}
                                        ${handicapTime ? `<div style="font-size:10px;color:#a0aec0;margin-top:2px;">${handicapTime}</div>` : ''}
                                    </div>

        function formatUpdated(updatedAt) {
            if (!updatedAt) return '未知';
            try {
                // 如果是 YYYY-MM-DD 格式（通常是爬虫直接抓取的本地时间字符串），直接返回
                // 简单的正则检查：以4位数字-2位数字开头
                if (typeof updatedAt === 'string' && /^\d{4}-\d{2}-\d{2}/.test(updatedAt)) {
                    return updatedAt;
                }
                
                const date = new Date(updatedAt);
                // 检查日期是否有效
                if (isNaN(date.getTime())) {
                    return String(updatedAt);
                }

                // 修正时区：减去8小时
                date.setHours(date.getHours() - 8);

                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                
                return `${year}-${month}-${day} ${hours}:${minutes}`;
            } catch (e) {
                return String(updatedAt);
            }
        }

            try {

                es.onmessage = (e) => {
                    if (logsEl) {
                        const line = document.createElement('div');

                es.addEventListener('done', (e) => {
                    if (logsEl) {
                        const line = document.createElement('div');

                    es.close();

                            <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" data-option="lose"> 客胜 <span style="color:#667eea;font-size:12px;">${euroLose}</span></label>

                            <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" data-option="h_draw"> 让平 <span style="color:#667eea;font-size:12px;">${hiDraw}</span></label>
                            <label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" data-option="h_lose"> 让负 <span style="color:#667eea;font-size:12px;">${hiAway}</span></label>
                        </div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <div style="font-weight:600;color:#4a5568;margin-bottom:8px;">信心指数：</div>
                        <div style="display:flex;gap:10px;">
                            <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:2px solid #e2e8f0;border-radius:6px;cursor:pointer;" onclick="this.querySelector('input').checked=true;">
                                <input type="radio" name="confidence" value="90" checked> <span style="font-weight:600;color:#38a169;">90%</span>
                            </label>
                            <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:2px solid #e2e8f0;border-radius:6px;cursor:pointer;" onclick="this.querySelector('input').checked=true;">
                                <input type="radio" name="confidence" value="70"> <span style="font-weight:600;color:#d69e2e;">70%</span>
                            </label>
                            <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:2px solid #e2e8f0;border-radius:6px;cursor:pointer;" onclick="this.querySelector('input').checked=true;">
                                <input type="radio" name="confidence" value="50"> <span style="font-weight:600;color:#718096;">50%</span>
                            </label>
                        </div>
                    </div>
                    <div style="text-align:right;display:flex;justify-content:flex-end;gap:10px;">
                        <button class="btn btn-primary" onclick="this.closest('#manualPredictOverlay').remove()">取消</button>
                        <button class="btn btn-success" onclick="(function(btn){
                            const box = btn.closest('div').parentNode;
                            const opts = Array.from(box.querySelectorAll('input[type=checkbox][data-option]:checked')).map(i=>i.getAttribute('data-option'));
                            const conf = box.querySelector('input[name=confidence]:checked');
                            const confidence = conf ? parseFloat(conf.value) : 90;
                            submitManualPredict('${matchId}', opts, confidence);
                        })(this);">确定</button>
                    </div>
                `;
                overlay.appendChild(box);
                document.body.appendChild(overlay);
            }
            async function submitManualPredict(matchId, options, confidence) {
                try {
                    const deviceId = getDeviceId();
                    const res = await fetch(`/api/predict/manual/${matchId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ options, confidence, device_id: deviceId })
                    });
                    const j = await res.json();
                    if (j.success) {
                        await loadMatches(currentPage);
                        const overlay = document.getElementById('manualPredictOverlay') || document.querySelector('body > div[style*="position:fixed"][style*="z-index:1000"]');
                        if (overlay) overlay.remove();
                    } else {
                        alert('保存失败：' + (j.message || '未知错误'));
                    }
                } catch (e) {
                    alert('请求失败：' + e.message);
                }
            }
            async function predictSingle(matchId) {
                const btn = event ? event.target : null;
                if (btn) { btn.disabled = true; btn.textContent = '预测中...'; }
                try {
                    const res = await fetch(`/api/predict/${matchId}`);
                    const j = await res.json();
                    if (j.success) {
                        alert('AI预测生成成功');
                        await loadMatches(currentPage);
                    } else {
                        alert('预测失败：' + (j.message || '未知错误'));
                    }
                } catch (e) {
                    alert('请求失败：' + e.message);
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = 'AI预测'; }
                }
            }
            async function updateMatch(matchId) {
                const btn = event ? event.target : null;
                if (btn) { btn.disabled = true; btn.textContent = '更新中...'; }
                try {
                    const res = await fetch(`/api/crawl_odds/${matchId}`);
                    const j = await res.json();
                    if (j.success) {
                        alert('数据更新成功');
                        await loadMatches(currentPage);
                    } else {
                        alert('更新失败：' + (j.message || '未知错误'));
                    }
                } catch (e) {
                    alert('请求失败：' + e.message);
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = '更新'; }
                }
            }





            // 我的选择功能
            async function showMyPicks() {
                try {
                    const res = await fetch('/api/my_picks');
                    const data = await res.json();
                    
                    if (!data.success) {
                        alert(data.message || '获取数据失败');
                        return;
                    }
                    
                    if (data.count === 0) {
                        alert('暂无手动标记的未开始比赛。\n请先在比赛列表中点击「手动」按钮进行标记。');
                        return;
                    }
                    
                    showMyPicksModal(data.data);
                } catch (e) {
                    alert('请求失败: ' + e.message);
                }
            }
            
            function showMyPicksModal(picks) {
                // 生成比赛行（带复选框）
                const rows = picks.map((p, i) => {
                    const confColor = p.confidence >= 85 ? '#38a169' : (p.confidence >= 65 ? '#d69e2e' : '#718096');
                    const oddsDisplay = p.main_odds ? p.main_odds.toFixed(2) : '-';
                    
                    return `
                        <tr style="border-bottom:1px solid #eee;" data-match='${JSON.stringify(p).replace(/'/g, "&#39;")}'>
                            <td style="padding:10px 8px;text-align:center;">
                                <input type="checkbox" class="pick-checkbox" data-idx="${i}" data-odds="${p.main_odds || 1}" checked style="width:18px;height:18px;cursor:pointer;">
                            </td>
                            <td style="padding:10px 8px;font-size:12px;">
                                <div style="font-weight:600;color:#667eea;">${p.league}</div>
                                <div style="color:#718096;font-size:11px;">${p.match_time}</div>
                            </td>
                            <td style="padding:10px 8px;font-size:13px;">
                                <div style="font-weight:600;">${p.home_team}</div>
                                <div style="color:#718096;">vs ${p.away_team}</div>
                            </td>
                            <td style="padding:10px 8px;text-align:center;">
                                <div style="font-weight:700;color:#667eea;font-size:14px;">${p.options_text.join(' / ')}</div>
                                <div style="font-size:11px;color:${confColor};margin-top:2px;">${p.confidence}%</div>
                            </td>
                            <td style="padding:10px 8px;text-align:center;font-size:12px;">
                                <div style="color:#718096;font-size:10px;">欧赔</div>
                                <div>${p.euro_odds}</div>
                            </td>
                            <td style="padding:10px 8px;text-align:center;font-size:12px;">
                                <div style="color:#718096;font-size:10px;">让球(${p.hi_handicap || '-'})</div>
                                <div>${p.hi_odds}</div>
                            </td>
                            <td style="padding:10px 8px;text-align:center;">
                                <span style="font-size:18px;font-weight:700;color:#e53e3e;">${oddsDisplay}</span>
                            </td>
                        </tr>
                    `;
                }).join('');
                
                const html = `
                    <div id="myPicksModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;" onclick="this.remove()">
                        <div style="background:white;border-radius:16px;max-width:1000px;width:100%;max-height:90vh;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,0.3);display:flex;flex-direction:column;" onclick="event.stopPropagation()">
                            
                            <!-- 头部 -->
                            <div style="background:linear-gradient(135deg, #00b09b 0%, #96c93d 100%);color:white;padding:18px 25px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    <div>
                                        <div style="font-size:20px;font-weight:700;">🎯 我的选择</div>
                                        <div style="font-size:13px;opacity:0.9;margin-top:4px;">共 ${picks.length} 场手动标记</div>
                                    </div>
                                    <button onclick="document.getElementById('myPicksModal').remove()" style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;">✕</button>
                                </div>
                            </div>
                            
                            <!-- 组合计算区 -->
                            <div style="background:#f7fafc;padding:15px 25px;border-bottom:1px solid #e2e8f0;">
                                <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
                                    <div>
                                        <span style="color:#718096;font-size:13px;">已选：</span>
                                        <span id="selectedCount" style="font-weight:700;color:#667eea;font-size:16px;">${picks.length}</span>
                                        <span style="color:#718096;font-size:13px;"> 场</span>
                                    </div>
                                    <div>
                                        <span style="color:#718096;font-size:13px;">组合赔率：</span>
                                        <span id="totalOdds" style="font-weight:700;color:#e53e3e;font-size:20px;">-</span>
                                    </div>
                                    <div>
                                        <span style="color:#718096;font-size:13px;">投100元回报：</span>
                                        <span id="returnAmount" style="font-weight:700;color:#38a169;font-size:16px;">-</span>
                                        <span style="color:#718096;font-size:13px;"> 元</span>
                                    </div>
                                    <div style="margin-left:auto;">
                                        <button onclick="selectAllPicks(true)" style="padding:6px 12px;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-right:8px;">全选</button>
                                        <button onclick="selectAllPicks(false)" style="padding:6px 12px;background:#e2e8f0;color:#4a5568;border:none;border-radius:6px;cursor:pointer;font-size:12px;">取消全选</button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 比赛列表 -->
                            <div style="flex:1;overflow-y:auto;padding:15px 25px;">
                                <table style="width:100%;border-collapse:collapse;font-size:13px;">
                                    <thead>
                                        <tr style="background:#f7fafc;">
                                            <th style="padding:10px 8px;text-align:center;font-weight:600;color:#4a5568;width:40px;">选</th>
                                            <th style="padding:10px 8px;text-align:left;font-weight:600;color:#4a5568;">比赛</th>
                                            <th style="padding:10px 8px;text-align:left;font-weight:600;color:#4a5568;">对阵</th>
                                            <th style="padding:10px 8px;text-align:center;font-weight:600;color:#4a5568;">我的选择</th>
                                            <th style="padding:10px 8px;text-align:center;font-weight:600;color:#4a5568;">欧赔</th>
                                            <th style="padding:10px 8px;text-align:center;font-weight:600;color:#4a5568;">让球指数</th>
                                            <th style="padding:10px 8px;text-align:center;font-weight:600;color:#4a5568;">赔率</th>
                                        </tr>
                                    </thead>
                                    <tbody id="picksTableBody">
                                        ${rows}
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- 推荐组合 -->
                            <div style="background:#fff3cd;padding:12px 25px;border-top:1px solid #ffeeba;">
                                <div style="font-size:13px;color:#856404;">
                                    💡 建议：选择2-4场高置信度比赛组成串关，控制总赔率在3-8倍之间。
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.body.insertAdjacentHTML('beforeend', html);
                
                // 绑定事件并计算初始赔率
                setTimeout(() => {
                    document.querySelectorAll('.pick-checkbox').forEach(cb => {
                        cb.addEventListener('change', calculateTotalOdds);
                    });
                    calculateTotalOdds();
                }, 100);
            }
            
            function selectAllPicks(select) {
                document.querySelectorAll('.pick-checkbox').forEach(cb => {
                    cb.checked = select;
                });
                calculateTotalOdds();
            }
            
            function calculateTotalOdds() {
                const checkboxes = document.querySelectorAll('.pick-checkbox:checked');
                let totalOdds = 1;
                let count = 0;
                
                checkboxes.forEach(cb => {
                    const odds = parseFloat(cb.dataset.odds);
                    if (odds && odds > 0) {
                        totalOdds *= odds;
                        count++;
                    }
                });
                
                const selectedCountEl = document.getElementById('selectedCount');
                const totalOddsEl = document.getElementById('totalOdds');
                const returnAmountEl = document.getElementById('returnAmount');
                
                if (selectedCountEl) selectedCountEl.textContent = count;
                
                if (count > 0) {
                    if (totalOddsEl) totalOddsEl.textContent = totalOdds.toFixed(2);
                    if (returnAmountEl) returnAmountEl.textContent = (totalOdds * 100).toFixed(0);
                } else {
                    if (totalOddsEl) totalOddsEl.textContent = '-';
                    if (returnAmountEl) returnAmountEl.textContent = '-';
                }
            }
        </script>
</body>
</html>
