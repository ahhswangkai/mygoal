<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史数据统计 - 足彩分析</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .content {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 25px;
            margin-bottom: 25px;
        }
        .filter-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 14px;
            color: #4a5568;
            font-weight: 600;
        }
        .filter-group select,
        .filter-group input {
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-block {
            display: block;
            width: 100%;
            margin-top: 20px;
        }
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f6f8ff 0%, #f0f4ff 100%);
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-card.good {
            background: linear-gradient(135deg, #f0fff4 0%, #e6ffed 100%);
        }
        .stat-card.good .value {
            color: #2f855a;
        }
        .stat-card.bad {
            background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
        }
        .stat-card.bad .value {
            color: #c53030;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #f7fafc;
        }
        th {
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        tbody tr:hover {
            background: #f7fafc;
        }
        .win-rate-high {
            color: #2f855a;
            font-weight: 700;
        }
        .win-rate-low {
            color: #c53030;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #c53030;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #718096;
        }
        .back-link {
            margin-bottom: 15px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        .league-stats {
            margin-top: 30px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-up {
            background: #fed7d7;
            color: #c53030;
        }
        .badge-down {
            background: #c6f6d5;
            color: #2f855a;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 1000px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            line-height: 1;
        }
        .modal-close:hover {
            color: #000;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .clickable-row {
            cursor: pointer;
        }
        .clickable-row:hover {
            background: #edf2f7;
        }
        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .match-teams {
            font-weight: 600;
            font-size: 16px;
        }
        .match-score {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
        }
        .odds-change {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            margin-top: 8px;
        }
        .odds-item {
            background: #f7fafc;
            padding: 8px;
            border-radius: 6px;
        }
        .odds-label {
            color: #666;
            margin-bottom: 2px;
        }
        .odds-value {
            font-weight: 600;
        }
        .change-up {
            color: #c53030;
        }
        .change-down {
            color: #2f855a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-link">
            <a href="/">← 返回首页</a>
            <a href="/calculator" style="margin-left:20px;background:linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);padding:8px 16px;border-radius:20px;color:white;text-decoration:none;font-size:13px;">🧮 计算器</a>
        </div>

        <div class="header">
            <h1>📊 历史数据统计分析</h1>
            <p>通过分析历史比赛盘口水位变化，找出庄家诱盘规律，帮助你做出更准确的判断</p>
        </div>

        <div class="content">
            <div class="filter-panel">
                <div class="filter-group">
                    <label>统计维度</label>
                    <select id="groupBy">
                        <option value="league">按联赛分组</option>
                        <option value="handicap">按盘口大小分组</option>
                        <option value="change_range">按水位变化幅度分组</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>筛选类型</label>
                    <select id="filterType">
                        <option value="hi_home_up">让球盘 - 主胜/让胜升水</option>
                        <option value="hi_home_down">让球盘 - 主胜/让胜降水</option>
                        <option value="hi_away_up">让球盘 - 客胜/让负升水</option>
                        <option value="hi_away_down">让球盘 - 客胜/让负降水</option>
                        <option value="euro_win_up">欧赔 - 主胜升水</option>
                        <option value="euro_win_down">欧赔 - 主胜降水</option>
                        <option value="asian_home_up">亚盘 - 主队升水</option>
                        <option value="asian_home_down">亚盘 - 主队降水</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>最小变化幅度</label>
                    <input type="number" id="minChange" step="0.01" min="0" value="0.05" placeholder="最小变化">
                </div>
                <div class="filter-group">
                    <label>联赛筛选</label>
                    <select id="leagueFilter">
                        <option value="">全部联赛</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>最小样本量</label>
                    <input type="number" id="minCount" min="1" value="5" placeholder="最少场次">
                </div>
                <div class="filter-group">
                    <label>时间范围</label>
                    <select id="timeRange">
                        <option value="">全部历史</option>
                        <option value="30">最近30天</option>
                        <option value="90">最近90天</option>
                        <option value="180">最近半年</option>
                        <option value="365">最近一年</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary btn-block" onclick="loadStats()">🔍 开始统计分析</button>

            <div id="overview" style="display: none; margin-top: 25px;">
                <div class="section-title">总体统计</div>
                <div class="stats-overview" id="statsOverview"></div>
            </div>

            <div id="resultContainer" style="display: none; margin-top: 25px;">
                <div class="section-title" id="resultTitle"></div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                ⏳ 正在分析数据，请稍候...
            </div>
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">比赛详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <script>
        let leaguesLoaded = false;

        // 页面加载时获取联赛列表
        document.addEventListener('DOMContentLoaded', function() {
            loadLeagues();
        });

        async function loadLeagues() {
            try {
                const res = await fetch('/api/stats/leagues');
                const data = await res.json();
                if (data.success) {
                    const select = document.getElementById('leagueFilter');
                    data.leagues.forEach(league => {
                        const option = document.createElement('option');
                        option.value = league;
                        option.textContent = league;
                        select.appendChild(option);
                    });
                    leaguesLoaded = true;
                }
            } catch (e) {
                console.error('加载联赛列表失败', e);
            }
        }

        function getChangeDirectionText(change) {
            return change > 0 ? '升水' : '降水';
        }

        function createOverview(stats) {
            const container = document.getElementById('statsOverview');
            container.innerHTML = '';

            const items = [
                { label: '总比赛场次', value: stats.total_matches, key: 'total' },
                { label: '主胜场次', value: stats.home_win, key: 'home_win' },
                { label: '平局场次', value: stats.draw, key: 'draw' },
                { label: '客胜场次', value: stats.away_win, key: 'away_win' },
                { label: '主胜概率', value: stats.home_win_rate + '%', key: 'home_win_rate' },
                { label: '平均水位变化', value: stats.avg_change.toFixed(2), key: 'avg_change' }
            ];

            items.forEach(item => {
                const card = document.createElement('div');
                let className = 'stat-card';
                if (item.key.includes('rate')) {
                    if (parseFloat(item.value) > 50) {
                        className += ' good';
                    } else if (parseFloat(item.value) < 30) {
                        className += ' bad';
                    }
                }
                card.className = className;
                card.innerHTML = `
                    <div class="label">${item.label}</div>
                    <div class="value">${item.value}</div>
                `;
                container.appendChild(card);
            });

            document.getElementById('overview').style.display = 'block';
        }

        function createTableHeader(groupBy) {
            const headers = {
                'league': ['联赛', '总场次', '主胜', '平局', '客胜', '主胜率', '盘口方向胜率', '平均水位变化'],
                'handicap': ['盘口', '总场次', '主胜', '平局', '客胜', '主胜率', '盘口方向胜率', '平均水位变化'],
                'change_range': ['变化幅度', '总场次', '主胜', '平局', '客胜', '主胜率', '盘口方向胜率', '平均水位变化']
            };

            const thead = document.getElementById('tableHeader');
            thead.innerHTML = '';
            headers[groupBy].forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                thead.appendChild(th);
            });
        }

        function createTableRow(group, stats, groupBy) {
            const row = document.createElement('tr');
            let groupName = group;

            if (groupBy === 'change_range') {
                const [min, max] = group.split('-').map(Number);
                groupName = `${min.toFixed(2)} ~ ${max.toFixed(2)}`;
            }

            const winRateClass = stats.home_win_rate > 50 ? 'win-rate-high' : stats.home_win_rate < 35 ? 'win-rate-low' : '';
            const handiRateClass = stats.handi_win_rate > 50 ? 'win-rate-high' : stats.handi_win_rate < 35 ? 'win-rate-low' : '';
            const cells = [
                groupName,
                stats.total,
                stats.home_win,
                stats.draw,
                stats.away_win,
                `<span class="${winRateClass}">${stats.home_win_rate.toFixed(1)}%</span>`,
                `<span class="${handiRateClass}">${stats.handi_win_rate.toFixed(1)}%</span>`,
                `${stats.avg_change.toFixed(2)}`
            ];

            cells.forEach(cell => {
                const td = document.createElement('td');
                td.innerHTML = cell;
                row.appendChild(td);
            });

            return row;
        }

        async function loadStats() {
            const groupBy = document.getElementById('groupBy').value;
            const filterType = document.getElementById('filterType').value;
            const minChange = parseFloat(document.getElementById('minChange').value) || 0;
            const leagueFilter = document.getElementById('leagueFilter').value;
            const minCount = parseInt(document.getElementById('minCount').value) || 1;
            const timeRange = document.getElementById('timeRange').value;

            // 显示加载
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('overview').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            try {
                const params = new URLSearchParams({
                    group_by: groupBy,
                    filter_type: filterType,
                    min_change: minChange,
                    league: leagueFilter,
                    min_count: minCount,
                    time_range: timeRange
                });

                const res = await fetch(`/api/stats/analyze?${params}`);
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';

                if (!data.success) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = '错误: ' + data.message;
                    return;
                }

                if (data.groups.length === 0) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = '没有找到符合条件的数据，请调整筛选条件';
                    return;
                }

                // 保存当前筛选条件供详情查询使用
                window.currentFilter = {
                    filter_type: filterType,
                    min_change: minChange,
                    league: leagueFilter,
                    time_range: timeRange
                };

                // 显示总体统计
                createOverview(data.overall);

                // 创建表格
                createTableHeader(groupBy);
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                // 按胜率排序
                data.groups.sort((a, b) => b.stats.home_win_rate - a.stats.home_win_rate);

                data.groups.forEach(item => {
                    const row = createTableRow(item.group, item.stats, groupBy);
                    row.classList.add('clickable-row');
                    row.addEventListener('click', () => openDetailModal(groupBy, item.group));
                    tbody.appendChild(row);
                });

                const timeText = timeRange ? `最近${timeRange}天` : '全部历史';
                document.getElementById('resultTitle').textContent =
                    `${timeText} - 分组统计结果 (共 ${data.groups.length} 组, ${data.overall.total_matches} 场比赛)`;
                document.getElementById('resultContainer').style.display = 'block';

            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '请求失败: ' + e.message;
                console.error(e);
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // 点击模态框背景关闭
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDetailModal();
            }
        });

        function getFilterTypeText(filterType) {
            const map = {
                'hi_home_up': '让球盘 - 主胜/让胜升水',
                'hi_home_down': '让球盘 - 主胜/让胜降水',
                'hi_away_up': '让球盘 - 客胜/让负升水',
                'hi_away_down': '让球盘 - 客胜/让负降水',
                'euro_win_up': '欧赔 - 主胜升水',
                'euro_win_down': '欧赔 - 主胜降水',
                'asian_home_up': '亚盘 - 主队升水',
                'asian_home_down': '亚盘 - 主队降水'
            };
            return map[filterType] || filterType;
        }

        async function openDetailModal(groupBy, groupValue) {
            // 显示弹窗
            const filterTypeText = getFilterTypeText(window.currentFilter.filter_type);
            document.getElementById('modalTitle').textContent = `${filterTypeText} - ${groupValue} - 比赛列表`;
            document.getElementById('detailModal').style.display = 'flex';
            document.getElementById('modalBody').innerHTML = '<div class="loading">⏳ 加载中...</div>';

            try {
                const params = new URLSearchParams({
                    ...window.currentFilter,
                    group_by: groupBy,
                    group_value: groupValue
                });

                const res = await fetch(`/api/stats/detail?${params}`);
                const data = await res.json();

                if (!data.success) {
                    document.getElementById('modalBody').innerHTML = `<div class="error">${data.message}</div>`;
                    return;
                }

                // 渲染比赛列表
                let html = `<div style="margin-bottom: 15px;"><strong>${filterTypeText} · 共找到 ${data.matches.length} 场比赛</strong></div>`;
                html += '<div style="display: grid; gap: 15px;">';

                data.matches.forEach(m => {
                    const changeClass = m.change > 0 ? 'change-up' : 'change-down';
                    const changeText = m.change > 0 ? '升水' : '降水';

                    html += `
                        <div style="border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; background: #fafafa;">
                            <div class="match-info">
                                <span class="match-teams">${m.league} | ${m.home_team} vs ${m.away_team}</span>
                                <span class="match-score">${m.home_score} - ${m.away_score}</span>
                            </div>
                            <div style="color: #666; font-size: 13px; margin-bottom: 12px;">${m.match_time}</div>

                            <!-- 当前筛选的目标水位变化 -->
                            <div style="border-left: 3px solid #667eea; padding-left: 10px; margin-bottom: 12px;">
                                <div style="font-size: 13px; color: #666; margin-bottom: 4px;"><strong>${filterTypeText}</strong></div>
                                <div class="odds-change">
                                    <div class="odds-item">
                                        <div class="odds-label">初始赔率</div>
                                        <div class="odds-value">${m.initial !== null ? m.initial.toFixed(2) : '-'}</div>
                                    </div>
                                    <div class="odds-item">
                                        <div class="odds-label">当前赔率</div>
                                        <div class="odds-value">${m.current !== null ? m.current.toFixed(2) : '-'}</div>
                                    </div>
                                    <div class="odds-item">
                                        <div class="odds-label">变化幅度</div>
                                        <div class="odds-value ${changeClass}">${changeText} ${Math.abs(m.change).toFixed(2)}</div>
                                    </div>
                                    <div class="odds-item">
                                        <div class="odds-label">盘口</div>
                                        <div class="odds-value">${m.handicap !== null ? m.handicap : '-'}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- 所有赔率完整信息 -->
                            <div style="font-size: 13px; color: #666; margin-bottom: 8px;"><strong>完整赔率信息</strong></div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">

                                <!-- 让球盘 -->
                                <div class="odds-item">
                                    <div class="odds-label">让球盘 - 主胜</div>
                                    <div class="odds-value">${m.hi_initial_home != null ? Number(m.hi_initial_home).toFixed(2) : '-'} → ${m.hi_current_home != null ? Number(m.hi_current_home).toFixed(2) : '-'}</div>
                                </div>
                                <div class="odds-item">
                                    <div class="odds-label">让球盘 - 平局</div>
                                    <div class="odds-value">${m.hi_initial_draw != null ? Number(m.hi_initial_draw).toFixed(2) : '-'} → ${m.hi_current_draw != null ? Number(m.hi_current_draw).toFixed(2) : '-'}</div>
                                </div>
                                <div class="odds-item">
                                    <div class="odds-label">让球盘 - 客胜</div>
                                    <div class="odds-value">${m.hi_initial_away != null ? Number(m.hi_initial_away).toFixed(2) : '-'} → ${m.hi_current_away != null ? Number(m.hi_current_away).toFixed(2) : '-'}</div>
                                </div>

                                <!-- 欧赔 -->
                                <div class="odds-item">
                                    <div class="odds-label">欧赔 - 主胜</div>
                                    <div class="odds-value">${m.euro_initial_win != null ? Number(m.euro_initial_win).toFixed(2) : '-'} → ${m.euro_current_win != null ? Number(m.euro_current_win).toFixed(2) : '-'}</div>
                                </div>
                                <div class="odds-item">
                                    <div class="odds-label">欧赔 - 平局</div>
                                    <div class="odds-value">${m.euro_initial_draw != null ? Number(m.euro_initial_draw).toFixed(2) : '-'} → ${m.euro_current_draw != null ? Number(m.euro_current_draw).toFixed(2) : '-'}</div>
                                </div>
                                <div class="odds-item">
                                    <div class="odds-label">欧赔 - 客胜</div>
                                    <div class="odds-value">${m.euro_initial_lose != null ? Number(m.euro_initial_lose).toFixed(2) : '-'} → ${m.euro_current_lose != null ? Number(m.euro_current_lose).toFixed(2) : '-'}</div>
                                </div>

                                <!-- 亚盘 -->
                                <div class="odds-item">
                                    <div class="odds-label">亚盘 - 主队</div>
                                    <div class="odds-value">${m.asian_initial_home != null ? Number(m.asian_initial_home).toFixed(2) : '-'} → ${m.asian_current_home != null ? Number(m.asian_current_home).toFixed(2) : '-'}</div>
                                </div>
                                <div class="odds-item">
                                    <div class="odds-label">亚盘 - 客队</div>
                                    <div class="odds-value">${m.asian_initial_away != null ? Number(m.asian_initial_away).toFixed(2) : '-'} → ${m.asian_current_away != null ? Number(m.asian_current_away).toFixed(2) : '-'}</div>
                                </div>
                                <div class="odds-item">
                                    <div class="odds-label">亚盘 - 盘口</div>
                                    <div class="odds-value">${m.asian_handicap != null ? m.asian_handicap : '-'}</div>
                                </div>
                            </div>

                            <a href="/match_detail/${m.match_id}" target="_blank" style="display: inline-block; margin-top: 12px; color: #667eea; font-size: 14px;">查看完整比赛详情 →</a>
                        </div>
                    `;
                });

                html += '</div>';
                document.getElementById('modalBody').innerHTML = html;

            } catch (e) {
                document.getElementById('modalBody').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
                console.error(e);
            }
        }
    </script>
</body>
</html>
